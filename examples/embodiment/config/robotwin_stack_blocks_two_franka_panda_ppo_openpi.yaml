defaults:
  - env/robotwin_stack_blocks_two_franka_panda@env.train
  - env/robotwin_stack_blocks_two_franka_panda@env.eval
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_stack_blocks_two_franka_panda_ppo_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  enable_offload: true
  train:
    rollout_epoch: 4
    total_num_envs: 32
    auto_reset: true
    max_episode_steps: 800
    max_steps_per_rollout_epoch: 800
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    task_config:
      camera:
        collect_wrist_camera: true

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 800
    max_steps_per_rollout_epoch: 800
    reward_coef: ${algorithm.reward_coef}
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: false
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      camera:
        collect_wrist_camera: true

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 256
  seed: 1234
  enable_offload: true
  model:
    # Use the Franka SFT checkpoint, not a 14D ALOHA checkpoint.
    model_path: ${oc.env:PI0_FRANKA_MODEL_PATH}
    num_action_chunks: 50
    action_dim: 8
    use_proprio: true
    add_value_head: true
    num_steps: 5
    openpi:
      config_name: pi0_base_franka_robotwin_full
      num_images_in_input: 2
      train_expert_only: false
      detach_critic_input: true
    openpi_data:
      repo_id: ${oc.env:ROBOTWIN_FRANKA_REPO_ID,robotwin/stack_blocks_two_franka_300}
      norm_stats_path: ${oc.env:ROBOTWIN_FRANKA_NORM_STATS_PATH,null}

  optim:
    lr: 5.6e-6
    value_lr: 1.1e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: fsdp
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
