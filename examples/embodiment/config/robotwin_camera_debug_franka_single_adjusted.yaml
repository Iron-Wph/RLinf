defaults:
  - env/robotwin_place_empty_cup_franka_panda@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

debug:
  output_dir: ${oc.env:REPO_PATH}/logs/camera_debug/franka_single_adjusted
  num_envs: 1
  camera_names: [third_view]

env:
  eval:
    total_num_envs: 1
    seed: 0
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: false
    task_config:
      embodiment: [franka-panda]
      single_arm: true
      active_arm: right
      dual_arm: false
      domain_randomization:
        random_background: false
        cluttered_table: false
        random_head_camera_dis: 0
        random_light: false
      camera:
        collect_head_camera: true
        collect_wrist_camera: true
        static_camera_list:
          - name: head_camera
            type: D435
            position: [0.0, -1.30, 1.35]
            forward: [0.0, 0.86, -0.51]
            left: [-1.0, 0.0, 0.0]
          - name: third_view
            type: D435
            position: [0.85, -1.35, 1.35]
            forward: [-0.42, 0.74, -0.52]
            left: [-0.87, -0.49, 0.0]

