env_type: robotwin
total_num_envs: null

auto_reset: false
ignore_terminations: false

reward_coef: 1.0
use_custom_reward: true
use_rel_reward: true
center_crop: true

seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 800
max_episode_steps: 800

is_eval: false

assets_path: "/path/to/robotwin_assets"
seeds_path: "/path/to/robotwin/train_seeds.json"

video_cfg:
  save_video: true
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: false

task_config:
  task_name: stack_blocks_two
  step_lim: 800
  planner_backend: mplib
  render_freq: 0
  episode_num: 100
  use_seed: false
  save_freq: 15

  embodiment: [franka-panda]
  single_arm: true
  active_arm: left
  dual_arm: false

  language_num: 100
  domain_randomization:
    random_background: true
    cluttered_table: true
    clean_background_rate: 0.02
    random_head_camera_dis: 0
    random_table_height: 0.03
    random_light: true
    crazy_random_light_rate: 0.02
  camera:
    head_camera_type: D435
    wrist_camera_type: D435
    collect_head_camera: true
    collect_wrist_camera: false
    static_camera_list:
      - name: head_camera
        type: D435
        position: [0.0, 0.85, 1.55]
        forward: [0.0, -0.82, -0.57]
        left: [1.0, 0.0, 0.0]
      - name: third_view
        type: D435
        position: [0.85, -1.35, 1.35]
        forward: [-0.42, 0.74, -0.52]
        left: [-0.87, -0.49, 0.0]
  data_type:
    rgb: true
    third_view: false
    depth: false
    pointcloud: false
    observer: false
    endpose: false
    qpos: true
    mesh_segmentation: false
    actor_segmentation: false
  pcd_down_sample_num: 1024
  pcd_crop: true
  save_path: ./data
  clear_cache_freq: 8
  collect_data: true
  eval_video_log: true
