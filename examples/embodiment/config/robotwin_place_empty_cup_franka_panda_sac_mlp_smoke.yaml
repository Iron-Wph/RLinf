defaults:
  - env/robotwin_place_empty_cup_franka_panda@env.train
  - env/robotwin_place_empty_cup_franka_panda@env.eval
  - model/mlp_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,actor,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_franka_panda_sac_mlp_smoke"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 1
  critic_actor_ratio: 1

  rollout_epoch: 1
  eval_rollout_epoch: 1

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -8
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 128
    sample_window_size: 128
    min_buffer_size: 0
    auto_save: False

  target_update_freq: 1
  target_update_type: all

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: 8
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 1
    reward_coef: 1.0
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH,/path/to/robotwin_assets}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: False
    enable_offload: False
    task_config:
      embodiment: [franka-panda]
      single_arm: true
      active_arm: right
      dual_arm: false
      planner_backend: mplib
      step_lim: 20
      camera:
        collect_wrist_camera: false
        static_camera_list:
          - name: head_camera
            type: D435
            position: [0.0, 0.85, 1.55]
            forward: [0.0, -0.82, -0.57]
            left: [1.0, 0.0, 0.0]
          - name: third_view
            type: D435
            position: [0.85, -1.35, 1.35]
            forward: [-0.42, 0.74, -0.52]
            left: [-0.87, -0.49, 0.0]

  eval:
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 1
    reward_coef: 1.0
    group_size: 1
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH,/path/to/robotwin_assets}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: False
    enable_offload: False
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      embodiment: [franka-panda]
      single_arm: true
      active_arm: right
      dual_arm: false
      planner_backend: mplib
      step_lim: 20
      camera:
        collect_wrist_camera: false
        static_camera_list:
          - name: head_camera
            type: D435
            position: [0.0, 0.85, 1.55]
            forward: [0.0, -0.82, -0.57]
            left: [1.0, 0.0, 0.0]
          - name: third_view
            type: D435
            position: [0.85, -1.35, 1.35]
            forward: [-0.42, 0.74, -0.52]
            left: [-0.87, -0.49, 0.0]

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False
  enable_drq: False
  compile_model: False

  model:
    obs_dim: 8
    action_dim: 8
    num_action_chunks: 1
    hidden_dim: 256
    precision: "32"
    add_value_head: False
    add_q_head: True

  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
