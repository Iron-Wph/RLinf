defaults:
  - model/pi0_pytorch_robotwin_lora@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# A single actor is intentionally pinned to GPU 1 by this recipe's launcher.
cluster:
  num_nodes: 1
  component_placement:
    actor: 1

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: "rlinf"
    experiment_name: "robotwin_pi0_aloha_native_jax_lora"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: "/mnt/public2/wph/codes/develop_async/RoboTwin_main_official/data/robotwin/adjust_bottle"
  num_workers: 2
  tolerance_s: 1.0e-4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Global batch = 16 micro batch x 2 accumulation steps on one A800.
  micro_batch_size: 16
  global_batch_size: 32
  seed: 42

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    # Matches the OpenPI/JAX cosine endpoint and the corrected warmup start.
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    # Native parameters are created before FSDP wrapping; no PEFT shape mutation.
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      # Single-rank FSDP keeps FP32 master parameters. FSDP1 otherwise casts
      # nested SigLIP LayerNorm leaves independently before their input cast.
      # BF16 compute remains enabled through AMP below.
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: "bf16"

reward:
  use_reward_model: false

critic:
  use_critic_model: false
