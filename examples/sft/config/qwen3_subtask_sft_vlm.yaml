defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"] # wandb, swanlab

  # sft runner use the len(dataset) as one epoch
  max_epochs: 6000
  max_steps: -1
  # eval the model interval
  val_check_interval: 1000
  # save the model interval
  save_interval: 1000
  experiment_name: qwen3_subtask_sft_vlm
  output_dir: ../results
  # resume_dir: /mnt/project_rlinf_hs/wph/codes/RLinf_pr_881/logs/all-50-tasks-qwen3_subtask_sft_vlm/qwen3_subtask_sft_vlm/checkpoints/global_step_1000
  # ckpt_path: /mnt/project_rlinf_hs/wph/codes/RLinf_pr_881/logs/test-qwen3_subtask_sft_vlm/qwen3_subtask_sft_vlm/checkpoints/global_step_1000/actor/model_state_dict/full_weights.pt
data:
  eval_print_predictions: true
  eval_print_max_samples: 50
  type: vlm
  dataset_name: "robo2vlm_subtask_sft"
  apply_chat_template: True
  use_chat_template: True
  # replace paths with your own dataset files
  # train_data_paths: /mnt/project_rlinf_hs/wph/datasets/behaviour/task-0000/subtask_sft_train.parquet
  # eval_data_paths: /mnt/project_rlinf_hs/wph/datasets/behaviour/task-0000/subtask_sft_eval.parquet
  # train_data_paths: /mnt/project_rlinf_hs/wph/datasets/behaviour/all_train.parquet
  # eval_data_paths: /mnt/project_rlinf_hs/wph/datasets/behaviour/all_eval.parquet
  eval_data_paths: /mnt/project_rlinf_hs/wph/datasets/behaviour/task-0005/subtask_sft_eval.parquet

  # free-text subtask generation fields
  prompt_key: "task_instruction"
  answer_key: "subtask_instruction"
  image_keys: ["initial_image", "current_image"]

  # optional system prompt for dataset template
  system_prompt: >-
    You are a robotic assistant specialized in subtask planning. I will provide you with:
    1. global_task: A global task instruction describing the final goal.
    2. initial_observation: An image of the initial state of the environment.
    3. current_observation: An image of the current state of the environment.

    Format:
    <global_task>: {global task instruction}.
    <initial_observation>: {initial observation image}.
    <current_observation>: {current observation image}.

    Based on the current observation and the final task instruction, determine the subtask that the robot is currently executing.

    IMPORTANT:
    - The subtask should reflect the current action being performed, not a future step.
    - The description must be concise and atomic.
    - Do not include unnecessary details or explanations.

    Output format:
    current_subtask: {short subtask description}.

  max_prompt_length: 1024
  lazy_loading: false
  num_workers: 16 # 4

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # micro_batch_size: 2
  # eval_batch_size: 2
  # global_batch_size: 64
  micro_batch_size: 2 # 4
  eval_batch_size: 8 # 4
  global_batch_size: 128 # 64 # 128 # 256
  seed: 42

  model:
    model_type: "qwen3_vl"
    precision: fp32
    # model_path: "/mnt/project_rlinf_hs/wph/models/models/Qwen3-VL-4B-Instruct/Qwen3-VL-4B-Instruct" # https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct
    # model_path: /mnt/project_rlinf_hs/wph/codes/RLinf_pr_881/logs/test-qwen3_subtask_sft_vlm/qwen3_subtask_sft_vlm/checkpoints/global_step_1000/hf
    model_path: /mnt/project_rlinf_hs/wph/codes/RLinf_pr_881/logs/all-50-tasks-qwen3_subtask_sft_vlm/qwen3_subtask_sft_vlm/checkpoints/global_step_6000/hf
    is_lora: False

  optim:
    lr: 1e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: "cosine"
    total_training_steps: ${runner.max_epochs}
    lr_warmup_steps: 200

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False