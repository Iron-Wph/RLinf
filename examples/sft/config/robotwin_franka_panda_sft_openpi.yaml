defaults:
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_franka_panda_pi0_sft"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: ${oc.env:ROBOTWIN_FRANKA_DATASET_PATH,/path/to/data/robotwin/stack_blocks_two_franka_300}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0

  model:
    precision: null
    model_path: ${oc.env:PI0_FRANKA_MODEL_PATH,/path/to/pi0-base-pytorch}
    num_action_chunks: 50
    action_dim: 8
    add_value_head: False
    openpi:
      config_name: "pi0_base_franka_robotwin_full"
      detach_critic_input: True
      num_images_in_input: 2
      train_expert_only: False
    openpi_data:
      repo_id: ${oc.env:ROBOTWIN_FRANKA_REPO_ID,robotwin/stack_blocks_two_franka_300}
      # Optional path to norm_stats.json or its containing directory.
      # When null, norm stats are loaded from model_path/<repo_id>/norm_stats.json.
      norm_stats_path: null

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
