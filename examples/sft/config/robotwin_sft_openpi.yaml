defaults:
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "test_openpi"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 30000
  max_steps: -1
  val_check_interval: -1
  save_interval: 5000

data:
  # data_path: /mnt/public/peihong/codes/RoboTwin_main/policy/pi0/training_data/adjust_bottle-demo_clean-50
  data_path: /mnt/public/peihong/codes/RoboTwin_main/data

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 128
  seed: 0

  # Override the default values in model/pi0
  model:
    precision: null
    model_path: /mnt/public/peihong/models/pi0_base
    num_action_chunks: 50 # interface for the env
    action_dim: 32
    use_proprio: True
    add_value_head: True
    openpi:
      config_name: "pi0_aloha_robotwin"
      detach_critic_input: True
      num_images_in_input: 3
      train_expert_only: True

  optim:
    # lr: 7.91e-6
    # value_lr: 1.55e-4
    # adam_beta1: 0.9
    # adam_beta2: 0.95
    # adam_eps: 1.0e-08
    # weight_decay: 0.01
    # clip_grad: 1.0
    # 优化器参数
    lr: 2.5e-5
    value_lr: 1.55e-4     # robotwin没有该参数
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    # 学习率调度器
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6
    last_epoch: -1    # 用于resume训练


  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False