defaults:
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0_pytorch_robotwin_native_lora_eval@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Two rollout ranks and two RobotWin environment ranks: GPU 0 and GPU 1.
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: "rlinf"
    experiment_name: "robotwin_adjust_bottle_openpi_pytorch_native_lora_eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  enable_offload: true
  eval:
    # 15 envs per GPU x 2 GPUs x 5 epochs = 150 RoboTwin eval seeds.
    rollout_epoch: 5
    total_num_envs: 30
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 200
    reward_coef: 1.0
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: false
    is_eval: true
    assets_path: "/mnt/public2/wph/models/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: false
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
