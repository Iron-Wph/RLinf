defaults:
  - env/robotwin_stack_blocks_two_franka_panda@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_stack_blocks_two_franka_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 800
    reward_coef: 5.0
    max_steps_per_rollout_epoch: 800
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: False
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      embodiment: [franka-panda]
      single_arm: true
      active_arm: left
      dual_arm: false
      planner_backend: mplib
      step_lim: 800
      camera:
        collect_wrist_camera: true

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:PI0_FRANKA_MODEL_PATH}
    num_action_chunks: 50
    action_dim: 8
    use_proprio: True
    add_value_head: False
    num_steps: 5
    openpi:
      config_name: "pi0_base_franka_robotwin_full"
      num_images_in_input: 2
      train_expert_only: False
      detach_critic_input: True
    openpi_data:
      repo_id: ${oc.env:ROBOTWIN_FRANKA_REPO_ID,robotwin/stack_blocks_two_franka_300}
      norm_stats_path: ${oc.env:ROBOTWIN_FRANKA_NORM_STATS_PATH,null}
